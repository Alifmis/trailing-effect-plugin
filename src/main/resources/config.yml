# TrailingEffectPlugin configuration
# Reload with /trailing reload (op/console only) — changes apply without a server restart.

# Maximum number of trailing effects each player can have at once.
# Set to 0 to disallow adding trails entirely.
max-trails-per-player: 2

# Particles that players are NOT allowed to add as trailing effects.
# Blocked for everyone (ops/console included). Use lowercase particle names,
# e.g.: explosion_emitter, elder_guardian, campfire_cosy_smoke
blocked-particles:
  - explosion_emitter
  - elder_guardian

# Spawn a trail particle only every N ticks while a player moves (1 = every tick).
# Higher values reduce particle packet load on the server and the client —
# the main performance knob for many players at once.
particle-spawn-interval-ticks: 2
